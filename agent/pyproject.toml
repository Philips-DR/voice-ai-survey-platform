[project]
name = "demeter-survey-agent"
version = "0.1.0"
description = "LiveKit voice agent for the Demeter BM270 IVR survey"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero]>=1.0",
    "livekit-plugins-silero>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
